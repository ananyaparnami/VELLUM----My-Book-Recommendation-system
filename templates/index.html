<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vellum - Book Recommender</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">
    <style>
        body { background-color: black; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .text-white { color: white !important; }

        /* Navbar: Sky Blue background matching your new logo */
        .navbar {
            background-color: #38b6ff !important;
            border: none;
            border-radius: 0;
            margin-bottom: 0;
            padding: 5px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left-side { display: flex; align-items: center; flex-grow: 1; }
        
        /* Text in Black for visibility on Sky Blue background */
        .brand-name {
            font-size: 32px;
            font-weight: bold;
            color: black !important;
            text-decoration: none;
            margin-right: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-links { list-style: none; display: flex; margin: 0; padding: 0; }
        .nav-links li a { color: black !important; text-decoration: none; margin-right: 25px; font-size: 18px; }
        .nav-links li a:hover { color: white !important; }

        .logo-right { height: 75px; width: auto; object-fit: contain; }

        /* Genre Section */
        .genre-container { display: flex; width: 100%; padding: 20px 0; }
        .genre-card { position: relative; flex: 1; height: 130px; overflow: hidden; border: 0.5px solid #222; }
        .genre-card img { width: 100%; height: 100%; object-fit: cover; filter: brightness(45%); }
        .genre-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 16px; text-transform: uppercase; text-align: center; width: 100%; }

        /* Book Grid Alignment */
        .book-row { display: flex; flex-wrap: wrap; }
        .card { background: transparent; border: none; height: 100%; display: flex; flex-direction: column; }
        .card-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .card-img-top { height: 260px; width: 100%; object-fit: contain; }
        .book-title { height: 45px; overflow: hidden; margin-top: 15px; line-height: 1.2; color: white; }
        .book-author { height: 20px; overflow: hidden; opacity: 0.7; font-size: 14px; margin-bottom: 10px; color: white; }
        
        hr { border-color: #333; margin: 40px 0; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left-side">
            <a href="/" class="brand-name">Vellum</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/recommend">Recommend</a></li>
            </ul>
        </div>
        <!-- Ensure your logo file name matches what is in your static folder -->
        <img src="{{ url_for('static', filename='logo.png') }}" class="logo-right" alt="Logo">
    </nav>

    <div class="container-fluid" style="padding: 0;">
        <h3 class="text-white" style="padding-left: 30px; margin-top: 30px; font-weight: 300;">Popular Genres</h3>
        <div class="genre-container">
            <div class="genre-card"><img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?w=600"><div class="genre-text">Classical</div></div>
            <div class="genre-card"><img src="https://images.unsplash.com/photo-1507413245164-6160d8298b31?w=600"><div class="genre-text">Science</div></div>
            <div class="genre-card"><img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600"><div class="genre-text">Sci-Fi</div></div>
            <div class="genre-card"><img src="https://images.unsplash.com/photo-1521503862198-2ae9a997bbc9?w=600"><div class="genre-text">Philosophy</div></div>
            <div class="genre-card"><img src="https://images.unsplash.com/photo-1589998059171-988d887df646?w=600"><div class="genre-text">Mystery</div></div>
        </div>
    </div>

    <div class="container">
        <hr>
        <div class="row book-row">
            <div class="col-md-12"><h1 class="text-white" style="font-size:45px; margin-bottom: 40px;">Top 50 Books</h1></div>
            {% for i in range(book_name|length) %}
                <div class="col-md-3" style="display: flex; margin-bottom: 40px;">
                    <div class="card w-100">
                        <div class="card-body">
                            <img class="card-img-top" src="{{ image[i] }}">
                            <p class="book-title"><strong>{{ book_name[i] }}</strong></p>
                            <h5 class="book-author">{{ author[i] }}</h5>
                            <div style="margin-top: auto;">
                                <p class="text-white" style="font-size: 13px; margin-bottom: 5px;">Votes: {{ votes[i] }}</p>
                                <p style="font-weight: bold; color: #ffcc00; font-size: 16px; margin: 0;">Rating: {{ rating[i]|round(2) }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
